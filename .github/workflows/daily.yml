name: Daily Gold Rates Video

on:
  schedule:
    - cron: '0 4 * * *'   # 8:00 AM UAE time (UTC+4)
  workflow_dispatch:        # allow manual trigger from GitHub UI for testing

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup with pip cache ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. System deps (ffmpeg for video encoding) ───────────────────────────
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      # ── 4. Python packages ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Restore previous rates (for change indicators) ──────────────────
      - name: Restore previous rates cache
        uses: actions/cache@v4
        with:
          path: last_rates.json
          key: gold-rates-${{ github.run_number }}
          restore-keys: gold-rates-

      # ── 7. Write .env from GitHub Secrets ───────────────────────────────────
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          GOLD_API_URL=https://api-dcog.sortd.pro/v1/rates
          GOLD_API_KEY=${{ secrets.GOLD_API_KEY }}
          GOLD_API_EMAIL=${{ secrets.GOLD_API_EMAIL }}
          GOLD_API_PASSWORD=${{ secrets.GOLD_API_PASSWORD }}
          GOLD_BEARER_TOKEN=
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          OUTPUT_DIR=output
          EOF

      # ── 6. Login to get fresh Bearer token (expires every 24h) ──────────────
      - name: Authenticate with Gold API
        run: python auth.py

      # ── 7. Generate video with live rates ────────────────────────────────────
      - name: Generate video
        run: python main.py

      # ── 8. Upload to Cloudinary, delete local file ───────────────────────────
      - name: Upload to Cloudinary
        run: |
          python - << 'EOF'
          import glob, os
          from uploader import upload_video
          videos = glob.glob("output/*.mp4")
          if not videos:
              raise FileNotFoundError("No MP4 found in output/")
          url = upload_video(videos[0])
          # Save URL for next step
          with open("cloudinary_url.txt", "w") as f:
              f.write(url)
          print(f"Video URL saved: {url}")
          EOF

      # ── 9. TODO: Post to Instagram (Phase 3 — needs Instagram token) ─────────
      # - name: Post to Instagram
      #   run: python post_instagram.py
      #   env:
      #     INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      #     INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
