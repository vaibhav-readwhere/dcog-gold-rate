name: End-of-Day Rate Snapshot

on:
  schedule:
    - cron: '0 14 * * *'   # 6:00 PM UAE time (UTC+4)
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore previous rates cache
        uses: actions/cache@v4
        with:
          path: last_rates.json
          key: gold-rates-${{ github.run_number }}
          restore-keys: gold-rates-

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          GOLD_API_URL=https://api-dcog.sortd.pro/v1/rates
          GOLD_API_KEY=${{ secrets.GOLD_API_KEY }}
          GOLD_API_EMAIL=${{ secrets.GOLD_API_EMAIL }}
          GOLD_API_PASSWORD=${{ secrets.GOLD_API_PASSWORD }}
          GOLD_BEARER_TOKEN=
          OUTPUT_DIR=output
          EOF

      - name: Authenticate with Gold API
        run: python auth.py

      - name: Fetch and save end-of-day rates
        run: python fetch_eod_rates.py
